name: Publish to GitHub Packages

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Single-digit odometer scheme: each of major/minor/patch only ever holds 0-9.
      # 0.0.9 -> 0.1.0, 0.9.9 -> 1.0.0, otherwise a plain +1 on the patch digit.
      - name: Bump version
        id: bump
        run: |
          set -euo pipefail

          CURRENT=$(grep -oE 'version = "[0-9]+\.[0-9]+\.[0-9]+"' ftt-ui-lib/build.gradle.kts | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ -z "$CURRENT" ]; then
            echo "Could not find a version = \"X.Y.Z\" line in ftt-ui-lib/build.gradle.kts" >&2
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          PATCH=$((PATCH + 1))
          if [ "$PATCH" -gt 9 ]; then
            PATCH=0
            MINOR=$((MINOR + 1))
            if [ "$MINOR" -gt 9 ]; then
              MINOR=0
              MAJOR=$((MAJOR + 1))
            fi
          fi

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "Bumping version: $CURRENT -> $NEW_VERSION"

          sed -i "s/version = \"$CURRENT\"/version = \"$NEW_VERSION\"/" ftt-ui-lib/build.gradle.kts

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Packages
        run: ./gradlew :ftt-ui-lib:publish
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Commit version bump and tag release
        run: |
          set -euo pipefail
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add ftt-ui-lib/build.gradle.kts
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git tag "v$NEW_VERSION"

          git push origin HEAD:main
          git push origin "v$NEW_VERSION"
